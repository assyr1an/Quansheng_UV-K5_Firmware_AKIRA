on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      # archlinux:latest, pinned by digest so CI and the local Dockerfile build
      # the same toolchain. Bump deliberately, together with the Dockerfile.
      image: archlinux@sha256:c9dc8b5d1b06d8d50ace6d42b2c93fbb1e34c9e1332d1a2102936e497d3187ae
    steps:
      - name: toolchain
        run: pacman -Syyu --noconfirm base-devel arm-none-eabi-gcc arm-none-eabi-newlib git python-pip python-crcmod python-cryptography

      - name: Checkout
        uses: actions/checkout@v4

      - name: safe.directory
        run: git config --global --add safe.directory /__w/akira-uvk5/akira-uvk5

      - name: Make
        run: make

      - name: size
        run: arm-none-eabi-size firmware

      - name: v2 reference self-test (RFC vectors + cryptography cross-check)
        run: python tools/v2-reference/v2_frame.py --selftest

      - name: v2 vector test (firmware codec vs known-answer frames)
        run: bash tools/v2-vectors-test/run.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: firmware*.bin

  release:
    # AKIRA releases use bare tags (0.9, 1.0.0); the inherited v* series is upstream's.
    if: ${{ startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    container:
      image: archlinux@sha256:c9dc8b5d1b06d8d50ace6d42b2c93fbb1e34c9e1332d1a2102936e497d3187ae
    steps:
      - name: toolchain
        run: pacman -Syyu --noconfirm base-devel arm-none-eabi-gcc arm-none-eabi-newlib git python-pip python-crcmod github-cli

      - name: Checkout
        uses: actions/checkout@v4

      - name: safe.directory
        run: git config --global --add safe.directory /__w/akira-uvk5/akira-uvk5

      - name: Make
        run: make

      - name: Package
        run: |
          cp firmware.bin "akira-${GITHUB_REF_NAME}.bin"
          cp firmware.packed.bin "akira-${GITHUB_REF_NAME}.packed.bin"
          sha256sum "akira-${GITHUB_REF_NAME}.bin" "akira-${GITHUB_REF_NAME}.packed.bin" > SHA256SUMS

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            "akira-${GITHUB_REF_NAME}.bin" "akira-${GITHUB_REF_NAME}.packed.bin" SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" --clobber

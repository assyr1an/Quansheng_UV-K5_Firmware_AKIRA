<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" width="760" height="190">
<text x="30" y="28" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="bold" fill="#e6edf3">v2 frame — 56 bytes on the air</text>
<rect x="30" y="46" width="140" height="64" rx="6" fill="#1f2a37" stroke="#3d444d" stroke-width="1.5"/><text x="100.0" y="73" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="bold" fill="#e6edf3">header</text><text x="100.0" y="93" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#9198a1">ver·type·sender·ctr</text><text x="100.0" y="130" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#9198a1">10 B — authenticated (AAD)</text>
<rect x="170" y="46" width="370" height="64" rx="6" fill="#252c23" stroke="#3d444d" stroke-width="1.5"/><text x="355.0" y="73" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="bold" fill="#e6edf3">ciphertext</text><text x="355.0" y="93" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#9198a1">ChaCha20, block 1+</text><text x="355.0" y="130" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#9198a1">30 B — encrypted + authenticated</text>
<rect x="540" y="46" width="190" height="64" rx="6" fill="#3b2d49" stroke="#3d444d" stroke-width="1.5"/><text x="635.0" y="73" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="bold" fill="#e6edf3">Poly1305 tag</text><text x="635.0" y="93" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#9198a1">one-time key, block 0</text><text x="635.0" y="130" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#9198a1">16 B</text>
<path d="M 30 148 H 530" stroke="#7ee787" stroke-width="2" fill="none"/>
<path d="M 30 143 V 148 M 530 143 V 148" stroke="#7ee787" stroke-width="2"/>
<text x="280" y="166" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#7ee787">everything under the tag — flip any of the 56 bytes and the frame is rejected</text>
<text x="30" y="184" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#9198a1">nonce = sender_id ‖ counter ‖ type ‖ 000  —  deterministic, reconstructed by the receiver, never transmitted</text>
</svg>